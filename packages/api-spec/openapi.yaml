  # ── Reporting ───────────────────────────────────────────────────────────
  /reports/time-summary:
    get:
      operationId: getTimeSummary
      tags: [reports]
      summary: Daily/monthly/yearly time-by-project rollup, individual or team scope
      parameters:
        - in: query
          name: period
          required: true
          schema: { $ref: '#/components/schemas/ReportPeriod' }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
          description: Any date within the target period
        - in: query
          name: scope
          required: true
          schema: { $ref: '#/components/schemas/ReportScope' }
        - in: query
          name: teamId
          schema: { type: string }
          description: Required when scope=team
        - in: query
          name: from
          schema: { type: string, format: date-time }
          description: Exact inclusive period boundary, supplied with `to` for the viewer's local timezone.
        - in: query
          name: to
          schema: { type: string, format: date-time }
          description: Exact exclusive period boundary, supplied with `from` for the viewer's local timezone.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Time summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TimeSummary' }

