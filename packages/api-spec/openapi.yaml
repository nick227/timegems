        '200':
          description: Active work session or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/WorkSessionDetail'
                      - type: 'null'

  /work-sessions/start:
    post:
      operationId: startWorkSession
      tags: [workSessions]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartWorkSessionInput' }
      responses:
        '201':
          description: Work session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkSessionDetail' }
        '409':
          description: An active session already exists for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /work-sessions/{workSessionId}:
    get:
      operationId: getWorkSession
      tags: [workSessions]
