openapi: 3.1.0
info:
  title: TimeGems API
  version: 0.0.1

servers:
  - url: http://localhost:3001
    description: Local dev

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: httpOnly session cookie (web) or Bearer token (native). No active-tenant check.
    adminAuth:
      type: http
      scheme: bearer
      description: Same session as bearerAuth, plus requires an AdminUser record (site admin).

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  parameters:
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
      description: Opaque cursor returned by the previous page.
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchQuery:
      in: query
      name: q
      schema: { type: string, minLength: 1, maxLength: 200 }

  schemas:
    PaginatedMeta:
      type: object
      required: [hasMore, nextCursor]
      properties:
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }

    # ── Enums (named so every usage site shares one definition) ────────────
    TenantPlan:
      type: string
      enum: [FREE, TEAM, ENTERPRISE]

    TenantRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER]

    Capability:
      type: string
      enum: [team:manage, project:manage, session:manage, site:admin]

    WorkSessionIntervalKind:
      type: string
      enum: [ACTIVE, PAUSED]

    WorkSessionStatus:
      type: string
      enum: [RUNNING, PAUSED, REVIEWING, STOPPED]

    ReportPeriod:
      type: string
      enum: [day, week, month, year]

    ReportScope:
      type: string
      enum: [individual, team]

    AgentReportType:
      type: string
      enum: [SUMMARY, REVIEW, PROPOSAL, GOAL]

    AgentReportChannel:
      type: string
      enum: [feed, discord, github, doc]

    AgentEmployeeKind:
      type: string
      enum: [SUMMARIZER, QA, PM, CODE_REVIEW, STEERING, CUSTOM]

    GoalStatus:
      type: string
      enum: [PROPOSED, ACTIVE, DONE, DROPPED]

    TextAssistMode:
      type: string
      enum: [enhance, summarize]

    # ── Identity ──────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, isAnonymous, createdAt]
      properties:
        id: { type: string }
        email: { type: [string, 'null'] }
        name: { type: string }
        avatarUrl: { type: [string, 'null'] }
        isAnonymous:
          type: boolean
          description: True until any credential (password or Google) is added via /auth/claim or /auth/claim/google.
        suspendedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    TenantMember:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [tenantRole]
          properties:
            tenantRole: { $ref: '#/components/schemas/TenantRole' }

    AuthResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
      # Session token delivered via Set-Cookie (httpOnly) -- not in the body.

    CurrentUserContext:
      type: object
      required: [user, tenant, capabilities]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tenant:
          oneOf:
            - $ref: '#/components/schemas/TenantSummary'
            - type: 'null'
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }

    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CurrentUserContext' }

    GoogleAuthInput:
      type: object
      required: [credential]
      properties:
        credential:
          type: string
          description: Google ID token from the Sign-In button callback

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 100 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }

    ClaimEmailInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }

    # ── Tenancy ───────────────────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, slug, plan, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        plan: { $ref: '#/components/schemas/TenantPlan' }
        createdAt: { type: string, format: date-time }

    TenantSummary:
      allOf:
        - $ref: '#/components/schemas/Tenant'
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/TenantRole' }

    CreateTenantInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 1, maxLength: 50, pattern: '^[a-z0-9-]+$' }

    Team:
      type: object
      required: [id, tenantId, name, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    CreateTeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    UpdateTeamInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    AddTeamMembersInput:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string }

    # ── Projects ──────────────────────────────────────────────────────────
    GemType:
      type: object
      required: [id, projectId, name, icon, color, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        icon: { type: string }
        color: { type: string }
        description: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    CreateGemTypeInput:
      type: object
      required: [name, icon, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        icon: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, minLength: 1, maxLength: 20 }
        description: { type: string, maxLength: 500 }

    UpdateGemTypeInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        icon: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, minLength: 1, maxLength: 20 }
        description: { type: [string, 'null'], maxLength: 500 }

    Project:
      type: object
      required: [id, tenantId, name, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        teamId: { type: [string, 'null'] }
        name: { type: string }
        color: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        gemType:
          oneOf:
            - $ref: '#/components/schemas/GemType'
            - type: 'null'

    CreateProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        teamId: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        gemType: { $ref: '#/components/schemas/CreateGemTypeInput' }

    UpdateProjectInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        teamId: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        archived: { type: boolean }
        gemType: { $ref: '#/components/schemas/UpdateGemTypeInput' }

    # ── Core work loop ────────────────────────────────────────────────────
    Note:
      type: object
      required: [id, workSessionId, authorId, body, isStopSummary, createdAt, updatedAt]
      properties:
        id: { type: string }
        workSessionId: { type: string }
        authorId: { type: string }
        body: { type: string }
        isStopSummary: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/User' }

    CreateNoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }

    UpdateNoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }

    WorkSessionInterval:
      type: object
      required: [id, kind, startedAt]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/WorkSessionIntervalKind' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }

    WorkSession:
      type: object
      required: [id, tenantId, userId, status, startedAt, activeDurationSec, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        userId: { type: string }
        projectId: { type: [string, 'null'] }
        goalId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/WorkSessionStatus' }
        startedAt: { type: string, format: date-time }
        stoppedAt: { type: [string, 'null'], format: date-time }
        activeDurationSec: { type: integer }
        correctedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        project:
          oneOf:
            - $ref: '#/components/schemas/Project'
            - type: 'null'
        goal:
          oneOf:
            - $ref: '#/components/schemas/Goal'
            - type: 'null'
        user: { $ref: '#/components/schemas/User' }

    WorkSessionDetail:
      allOf:
        - $ref: '#/components/schemas/WorkSession'
        - type: object
          properties:
            notes:
              type: array
              items: { $ref: '#/components/schemas/Note' }
            intervals:
              type: array
              items: { $ref: '#/components/schemas/WorkSessionInterval' }
            gemsAwarded:
              type: [integer, 'null']
              description: Gems committed to the ledger for this session. Null until STOPPED, or if the project has no gem type.

    WorkSessionHistoryItem:
      allOf:
        - $ref: '#/components/schemas/WorkSession'
        - type: object
          required: [notes, gemsAwarded]
          properties:
            notes:
              type: array
              items: { $ref: '#/components/schemas/Note' }
            gemsAwarded:
              type: [integer, 'null']
              description: Gems committed to the ledger for this session. Null until STOPPED, or if the project has no gem type.

    StartWorkSessionInput:
      type: object
      properties:
        projectId: { type: [string, 'null'] }
        goalId: { type: [string, 'null'] }

    UpdateWorkSessionInput:
      type: object
      properties:
        projectId: { type: [string, 'null'] }
        goalId:
          type: [string, 'null']
          description: If the goal has a projectId, the session's own projectId must match it.
        activeDurationSec:
          type: integer
          minimum: 0
          description: Manual correction of a STOPPED session's duration. Triggers a full gem-ledger recompute for this user+project.

    StopWorkSessionInput:
      type: object
      properties:
        note: { type: string, maxLength: 5000 }

    # ── Reporting ─────────────────────────────────────────────────────────
    TimeSummaryEntry:
      type: object
      required: [projectId, projectName, durationSec, gemsEarned]
      properties:
        projectId: { type: [string, 'null'] }
        projectName: { type: [string, 'null'] }
        userId: { type: string }
        durationSec: { type: integer }
        gemsEarned:
          type: integer
          description: Aggregate only — never render as a per-member ranking (see functional-design.md).

    TimeSummary:
      type: object
      required: [period, date, scope, totalDurationSec, totalGemsEarned, sessionCount, projectsWorked, goalsAdvanced, entries]
      properties:
        period: { $ref: '#/components/schemas/ReportPeriod' }
        date: { type: string, format: date }
        scope: { $ref: '#/components/schemas/ReportScope' }
        teamId: { type: [string, 'null'] }
        totalDurationSec: { type: integer }
        totalGemsEarned: { type: integer }
        sessionCount: { type: integer }
        projectsWorked: { type: integer }
        goalsAdvanced: { type: integer }
        entries:
          type: array
          items: { $ref: '#/components/schemas/TimeSummaryEntry' }

    # ── TimeGem economy ─────────────────────────────────────────────────────
    GemBalance:
      type: object
      required: [projectId, projectName, gemType, totalGems, carrySec]
      properties:
        projectId: { type: string }
        projectName: { type: string }
        gemType: { $ref: '#/components/schemas/GemType' }
        totalGems: { type: integer }
        carrySec:
          type: integer
          description: Seconds of active work already banked toward this project's next gem.

    # ── AI agent workforce ────────────────────────────────────────────────
    AgentReport:
      type: object
      required: [id, agentEmployeeId, tenantId, type, title, body, createdAt]
      properties:
        id: { type: string }
        agentEmployeeId: { type: string }
        tenantId: { type: string }
        teamId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/AgentReportType' }
        title: { type: string }
        body: { type: string }
        postedTo:
          type: array
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/AgentReportChannel' }
              ref: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    AgentEmployee:
      type: object
      required: [id, tenantId, kind, name, enabled, schedule, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        kind: { $ref: '#/components/schemas/AgentEmployeeKind' }
        name: { type: string }
        enabled: { type: boolean }
        schedule: { type: string }
        lastRunAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    # ── Goals ─────────────────────────────────────────────────────────────
    Goal:
      type: object
      required: [id, tenantId, title, description, status, progressPercent, complexityScore, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        teamId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
        createdByUserId: { type: [string, 'null'] }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/GoalStatus' }
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        complexityScore:
          type: integer
          minimum: 1
          maximum: 5
          description: Relative sizing, 1 (trivial) to 5 (very complex) -- not a time estimate on its own.
        estimatedHours: { type: [number, 'null'] }
        loggedSec:
          type: integer
          description: Live aggregate of activeDurationSec across all STOPPED WorkSessions tagged with this goal -- computed on read, never stored.
        sourceAgentReportId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    CreateGoalInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        teamId: { type: [string, 'null'] }
        projectId: { type: [string, 'null'] }
        complexityScore: { type: integer, minimum: 1, maximum: 5 }
        estimatedHours: { type: [number, 'null'], minimum: 0 }

    ProjectGoalImportRow:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        complexityScore: { type: integer, minimum: 1, maximum: 5 }
        estimatedHours: { type: [number, 'null'], minimum: 0 }

    ImportProjectGoalsInput:
      type: object
      additionalProperties: false
      required: [goals]
      properties:
        goals:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/ProjectGoalImportRow' }

    UpdateGoalInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        projectId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/GoalStatus' }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        complexityScore: { type: integer, minimum: 1, maximum: 5 }
        estimatedHours: { type: [number, 'null'], minimum: 0 }

    # ── Text assist ───────────────────────────────────────────────────────
    CreateTextAssistInput:
      type: object
      required: [text, mode]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        mode: { $ref: '#/components/schemas/TextAssistMode' }

    # ── Admin ─────────────────────────────────────────────────────────────
    AdminUpdateTenantInput:
      type: object
      properties:
        plan: { $ref: '#/components/schemas/TenantPlan' }
        suspended: { type: boolean }

    AdminUpdateUserInput:
      type: object
      properties:
        suspended: { type: boolean }

paths:
  # ── Auth ────────────────────────────────────────────────────────────────
  /auth/google:
    post:
      operationId: googleAuth
      security: []
      tags: [auth]
      summary: Sign in or register with Google
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthInput' }
      responses:
        '200':
          description: Authenticated -- session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Invalid Google credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Account suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Google sign-in is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/anonymous:
    post:
      operationId: anonymousAuth
      security: []
      tags: [auth]
      summary: Create an instant guest account (auto-assigned name, personal tenant) -- no request body
      responses:
        '201':
          description: Guest session created -- session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '429':
          description: Too many guest accounts created from this IP recently
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/register:
    post:
      operationId: registerWithEmail
      security: []
      tags: [auth]
      summary: Register with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Registered -- session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Invalid email or password too short
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/login:
    post:
      operationId: loginWithEmail
      security: []
      tags: [auth]
      summary: Sign in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Authenticated -- session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Account suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/claim:
    post:
      operationId: claimWithEmail
      tags: [auth]
      summary: Add email + password to the current (e.g. anonymous) user in place -- never creates a second account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimEmailInput' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid email or password too short
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '200':
          description: Account updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /auth/claim/google:
    post:
      operationId: claimWithGoogle
      tags: [auth]
      summary: Link a Google identity to the current (e.g. anonymous) user in place -- never creates a second account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthInput' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid Google credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: This Google account is already linked to a different user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '200':
          description: Account updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Logged out -- clears session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: 'null' }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Current user, active tenant, and server-derived capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }

  # ── Tenants ─────────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: listMyTenants
      tags: [tenants]
      summary: Tenants the current user belongs to
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tenants
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TenantSummary' }
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant; caller becomes OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantInput' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TenantSummary' }

  /tenants/{tenantId}/select:
    post:
      operationId: selectActiveTenant
      tags: [tenants]
      summary: Set the active tenant for the current session
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
