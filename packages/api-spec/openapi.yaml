      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Paginated agent reports
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AgentReport' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }

  /agent-reports/{agentReportId}:
    get:
      operationId: getAgentReport
      tags: [agentReports]
      parameters:
        - in: path
          name: agentReportId
          required: true
          schema: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Agent report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AgentReport' }

  # ── Goals ─────────────────────────────────────────────────────────────────
  # A Goal (agent-proposed via Steering, or authored directly by a human for
  # project planning) is the unit of planning: it can be scoped to a Project,
  # carries a completeness percentage and a complexity score, and WorkSessions
  # can be tagged with one so logged time rolls up against it. An
  # agent-sourced goal is still inert (PROPOSED) until a human acts on it here
  # -- "agents only propose" is only a real rule if there's a page where a
  # human can approve or drop the proposal. Human-authored goals skip that
  # gate (they start ACTIVE) since nobody needs to approve their own goal.
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: Goals for the active tenant, any status
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/GoalStatus' }
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Paginated goals
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Goal' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
    post:
      operationId: createGoal
      tags: [goals]
      summary: Author a goal directly for project planning (starts ACTIVE, no approval gate)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGoalInput' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Goal' }

  /goals/{goalId}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Approve/drop/complete a proposed goal, or edit any goal's planning fields
      parameters:
        - in: path
          name: goalId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGoalInput' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Goal updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Goal' }

  /projects/{projectId}/goals/import:
    post:
      operationId: importProjectGoals
      tags: [goals]
      summary: Atomically import ACTIVE goals into one project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportProjectGoalsInput' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Project not found in the active tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '201':
          description: Goals imported
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [imported]
                    properties:
                      imported: { type: integer, minimum: 1, maximum: 500 }

  /text-assist:
    post:
      operationId: createTextAssist
      tags: [textAssist]
      description: >-
        Heuristic (not a real LLM call yet) -- same documented-placeholder
        pattern as AgentEmployeeService, so a real model call can replace
        the transform logic later without changing this contract.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTextAssistInput' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Transformed text
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [result]
                    properties:
                      result: { type: string }

