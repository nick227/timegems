                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkSessionDetail' }
    delete:
      operationId: deleteWorkSession
      tags: [workSessions]
      summary: Delete a stopped session (owner or tenant admin); recomputes the gem ledger
      parameters:
        - in: path
          name: workSessionId
          required: true
          schema: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Work session deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: 'null' }

  /work-sessions/{workSessionId}/pause:
    post:
      operationId: pauseWorkSession
