          required: true
          schema: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Work session detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkSessionDetail' }
    patch:
      operationId: updateWorkSession
      tags: [workSessions]
      summary: Correct a session's duration, project, or goal; stopped-session corrections recompute gem ledgers
      parameters:
        - in: path
          name: workSessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
